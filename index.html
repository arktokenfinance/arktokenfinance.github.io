<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK Token Finance</title>
    <style>
        body { 
            background-image: url('lxM91ECNnG2uqekhM2jQ4f-ahs-dC6WcPhuRdKF1Htq27YZcA.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0; padding: 20px; text-align: center; font-family: Arial, sans-serif; color: #d4af37;
        }
        .container { 
            max-width: 500px; margin: 0 auto; border: 2px solid #d4af37; padding: 20px; 
            border-radius: 15px; background: rgba(0, 0, 0, 0.85); 
        }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #d4af37; color: #d4af37; text-decoration: none; border-radius: 8px; font-weight: bold; box-sizing: border-box; }
        .btn-main { background: #d4af37; color: #000; }
        select { background: #000; color: #d4af37; border: 1px solid #d4af37; padding: 5px; }
    </style>
</head>
<body>
<div class="container">
    <select id="langSelector" onchange="updateContent()">
        <option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option>
        <option value="tr">Türkçe</option><option value="ru">Русский</option><option value="zh">中文</option>
        <option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option>
        <option value="ja">日本語</option><option value="ko">한국어</option><option value="it">Italiano</option>
        <option value="pt">Português</option><option value="hi">हिन्दी</option><option value="nl">Nederlands</option>
        <option value="vi">Tiếng Việt</option><option value="th">ไทย</option><option value="id">Indonesian</option>
        <option value="uk">Українська</option><option value="el">Ελληνικά</option>

    <a href="YOUR_INSTAGRAM_LINK" class="btn" id="btn-ig">Instagram</a>
    <a href="YOUR_BUY_LINK" class="btn btn-main" id="btn-buy">Buy Token Now</a>
    <p style="font-size: 0.8rem; margin-top:20px;" id="date-text"></p>
</div>

    function updateContent() {
        const lang = document.getElementById('langSelector').value;
        const t = translations[lang];
        document.getElementById('title').innerText = t.title;
        document.getElementById('price-label').innerText = t.price;
        document.getElementById('btn-tg').innerText = t.tg;
        document.getElementById('btn-ig').innerText = t.ig;
        document.getElementById('btn-buy').innerText = t.buy;
    }
    document.getElementById('date-text').innerText = "Date: " + new Date().toLocaleDateString('en-GB');
</script>
</body>
</html>
