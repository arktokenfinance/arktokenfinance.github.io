<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK Token Finance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 10px; }
        .wrapper { width: 100%; max-width: 400px; }
        .content-box { border: 2px solid #d4af37; padding: 15px; border-radius: 15px; background: #0a0a0a; display: flex; flex-direction: column; gap: 15px; }
        .main-logo { width: 100%; border-radius: 10px; display: block; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border: 1px solid #d4af37; background: #000; color: #fff; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 14px; text-align: center; }
        .full-width { width: 100%; padding: 15px; background: #d4af37; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: black; font-size: 16px; }
        select { background: #000; color: #d4af37; padding: 12px; width: 100%; border: 1px solid #d4af37; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="content-box">
        <!-- تصویر جدید شما -->
        <img src="IMG_۲۰۲۶۰۹۲۰_۲۰۳۳۴۳.jpg" alt="ARK Logo" class="main-logo">
        
        <select id="langSwitcher" onchange="changeLanguage()">
            <option value="en">English</option> <option value="fa">فارسی</option> <option value="ar">العربية</option>
            <option value="zh">中文</option> <option value="es">Español</option> <option value="fr">Français</option>
            <option value="de">Deutsch</option> <option value="ru">Русский</option> <option value="pt">Português</option>
            <option value="hi">हिन्दी</option> <option value="ja">日本語</option> <option value="tr">Türkçe</option>
            <option value="it">Italiano</option> <option value="ko">한국어</option> <option value="nl">Nederlands</option>
            <option value="el">Ελληνικά</option> <option value="vi">Tiếng Việt</option> <option value="id">Bahasa</option>
            <option value="th">ไทย</option> <option value="ur">اردو</option>
        </select>

        <div class="grid-menu">
            <button class="btn" id="t-support" onclick="openSupport()">Support</button>
            <a href="https://t.me/YOUR_TELEGRAM" class="btn" id="t-telegram">Telegram</a>
            <a href="https://instagram.com/YOUR_INSTA" class="btn" id="t-insta">Instagram</a>
            <div class="btn" id="date"></div>
        </div>

        <div class="btn" id="t-price" style="border-color:#d4af37; color:#d4af37; font-weight: bold;">1 ARK = 0.001 USDT</div>
        <button class="full-width" id="t-buy" onclick="buyToken()">Buy Token Now</button>
        <div id="status" style="font-size:14px; color:#d4af37; text-align:center;"></div>
    </div>
</div>

<script>
    const t = {
        'en': { sup: 'Support', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Buy Token Now' },
        'fa': { sup: 'پشتیبانی', tg: 'تلگرام', ins: 'اینستاگرام', pr: '۱ توکن = ۰.۰۰۱ تتر', buy: 'خرید فوری' },
        'ar': { sup: 'الدعم', tg: 'تيليجرام', ins: 'انستغرام', pr: '1 ARK = 0.001 USDT', buy: 'شراء الآن' },
        'zh': { sup: '支持', tg: '电报', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: '立即购买' },
        'es': { sup: 'Soporte', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Comprar' },
        'fr': { sup: 'Support', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Acheter' },
        'de': { sup: 'Hilfe', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Kaufen' },
        'ru': { sup: 'Поддержка', tg: 'Телеграм', ins: 'Инстаграм', pr: '1 ARK = 0.001 USDT', buy: 'Купить' },
        'pt': { sup: 'Suporte', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Comprar' },
        'hi': { sup: 'सहायता', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'खरीदें' },
        'ja': { sup: 'サポート', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: '購入' },
        'tr': { sup: 'Destek', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Hemen Al' },
        'it': { sup: 'Supporto', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Acquista' },
        'ko': { sup: '지원', tg: '텔레그램', ins: '인스타그램', pr: '1 ARK = 0.001 USDT', buy: '구매' },
        'nl': { sup: 'Ondersteuning', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Kopen' },
        'el': { sup: 'Υποστήριξη', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Αγορά' },
        'vi': { sup: 'Hỗ trợ', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Mua' },
        'id': { sup: 'Dukungan', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'Beli' },
        'th': { sup: 'ซัพพอร์ต', tg: 'Telegram', ins: 'Instagram', pr: '1 ARK = 0.001 USDT', buy: 'ซื้อ' },
        'ur': { sup: 'مدد', tg: 'ٹیلیگرام', ins: 'انسٹاگرام', pr: '1 ARK = 0.001 USDT', buy: 'خریدیں' }
    };
    function changeLanguage() { const lang = document.getElementById('langSwitcher').value; const txt = t[lang] || t['en']; document.getElementById('t-support').innerText = txt.sup; document.getElementById('t-telegram').innerText = txt.tg; document.getElementById('t-insta').innerText = txt.ins; document.getElementById('t-price').innerText = txt.pr; document.getElementById('t-buy').innerText = txt.buy; }
    function updateClock() { document.getElementById('date').innerText = new Date().toLocaleDateString('en-US'); }
    updateClock();
    async function buyToken() { if (!window.ethereum) return alert("Please install MetaMask or TrustWallet"); const provider = new ethers.providers.Web3Provider(window.ethereum); await provider.send("eth_requestAccounts", []); const signer = provider.getSigner(); const contract = new ethers.Contract("0xe9069dc6a0dd6d3e375a1eef3520ada61d4ef5cf", [{"inputs":[{"internalType":"uint256","name":"usdtAmount","type":"uint256"}],"name":"buy","outputs":[],"stateMutability":"nonpayable","type":"function"}], signer); try { document.getElementById('status').innerText = "Processing..."; const tx = await contract.buy(ethers.utils.parseUnits("1", 6)); await tx.wait(); document.getElementById('status').innerText = "Success!"; } catch (e) { document.getElementById('status').innerText = "Error or User Rejected"; } }
    function openSupport() { alert("کد Tawk.to را در اینجا جایگزین کنید"); }
</script>

</body>
</html>
